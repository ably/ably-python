# Workspace root. This file is not published: the two distributions built from
# this repository are `core/` (ably-pubsub-core) and `server/` (ably-pubsub-server).
# It carries the shared developer tooling configuration only.

[tool.uv.workspace]
members = ["core", "server"]

[tool.uv.sources]
ably-pubsub-core = { workspace = true }
ably-pubsub-server = { workspace = true }

[dependency-groups]
dev = [
  "ably-pubsub-core[crypto,vcdiff]",
  "ably-pubsub-server",
  "pytest>=7.1,<8.0",
  "pytest-asyncio>=0.23.0,<1.0.0",
  "mock>=4.0.3,<5.0.0",
  "pytest-cov>=2.4,<3.0",
  "ruff>=0.14.0,<1.0.0",
  "pytest-xdist>=1.15,<2.0",
  "respx>=0.22.0,<0.23.0",
  "importlib-metadata>=4.12,<5.0",
  "pytest-timeout>=2.1.0,<3.0.0",
  "tokenize_rt",
  # Used by scripts/release_preflight.py to validate the built distributions'
  # metadata before anything is uploaded.
  "twine>=4.0,<7.0",
  "vcdiff-decoder>=0.1.0a1",
]

[[tool.uv.index]]
name = "experimental"
url = "https://test.pypi.org/simple/"
explicit = true

[tool.pytest.ini_options]
timeout = 30
asyncio_mode = "auto"

[tool.ruff]
line-length = 115
# The workspace root has no [project] table for ruff to infer this from; it must
# match `requires-python` in core/ and server/.
target-version = "py38"
extend-exclude = [
  "core/src/ably_pubsub/core/sync",
  "test/ably/sync",
]

[tool.ruff.lint]
# Enable Pyflakes (F), pycodestyle (E, W), pep8-naming (N), isort (I), pyupgrade (UP), bugbear (B) and comprehensions (C4)
select = ["E", "W", "F", "N", "I", "UP", "B", "C4"]
ignore = [
  "N818",  # exception name should end in 'Error'
  "UP026",  # mock -> unittest.mock (need mock package for AsyncMock support on old Pythons)
]

[tool.ruff.lint.isort]
known-first-party = ["ably_pubsub"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # imported but unused
