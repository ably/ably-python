[project]
name = "ably-pubsub-core"
version = "4.0.0"
description = "INTERNAL implementation package for Ably's Pub/Sub SDKs. Not for direct use — install ably-pubsub-server instead."
readme = "README.md"
requires-python = ">=3.8"
license = "Apache-2.0"
# A copy of the repository root LICENSE lives beside this file: PEP 639
# licence file globs cannot escape the project directory, and a symlink is not
# followed into the wheel. Keep the copies identical to /LICENSE.
license-files = ["LICENSE"]
# No `License ::` classifier: PEP 639 supersedes them and PyPI rejects metadata
# that carries both a licence expression and a licence classifier.
authors = [
  { name = "Ably", email = "support@ably.com" }
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "msgpack>=1.0.0,<2.0.0",
  "httpx>=0.25.0,<1.0",
  "h2>=4.1.0,<5.0.0",
  "websockets>=12.0,<15.0; python_version=='3.8'",
  "websockets>=15.0,<16.0; python_version>='3.9'",
  "pyee>=11.1.0,<14.0.0",
]

[project.optional-dependencies]
oldcrypto = ["pycrypto>=2.6.1,<3.0.0"]
crypto = ["pycryptodome"]
vcdiff = ["vcdiff-decoder>=0.1.0,<0.2.0"]

[project.scripts]
unasync = "ably_pubsub.core.scripts.unasync:run"

[project.urls]
Homepage = "https://ably.com"
Repository = "https://github.com/ably/ably-python"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
ignore-vcs = true
# Hatchling defaults to core metadata 2.5, which the newest `twine` resolvable
# under this project's Python floor refuses to parse. 2.4 carries everything
# used here, PEP 639 licence expressions included.
core-metadata-version = "2.4"
include = [
    "/src/ably_pubsub",
    "/README.md",
    "/pyproject.toml"
]
exclude = [
    "**/*.pyc",
    "**/__pycache__"
]

[tool.hatch.build.targets.wheel]
ignore-vcs = true
# Hatchling defaults to core metadata 2.5, which the newest `twine` resolvable
# under this project's Python floor refuses to parse. 2.4 carries everything
# used here, PEP 639 licence expressions included.
core-metadata-version = "2.4"
# PEP 420: `src/ably_pubsub` has no __init__.py, so this ships
# `ably_pubsub/core/**` into the shared `ably_pubsub` namespace.
packages = ["src/ably_pubsub"]
