# This workflow will install Python dependencies, run tests and lint with a variety of Python versions.
# Based upon:
#   https://github.com/actions/starter-workflows/blob/main/ci/python-package.yml
# As directed from:
#   https://docs.github.com/en/actions/guides/building-and-testing-python#starting-with-the-python-workflow-template

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - integration/v4

permissions: {}

jobs:
  check:
    permissions:
      contents: read
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: 'recursive'
          persist-credentials: false
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        id: setup-python
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        name: Define a cache for the virtual environment based on the dependencies lock file
        id: cache
        with:
          path: ./.venv
          key: venv-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('uv.lock') }}

      - name: Install dependencies
        # The dev dependency group installs both workspace members editable,
        # with the core's crypto and vcdiff extras.
        run: uv sync
      - name: Generate rest sync code and tests
        run: uv run unasync
      - name: Test with pytest
        run: uv run pytest --verbose --tb=short --capture=no

  # The release pre-flight, run on every pull request against the versions in
  # the tree. A drifted version site, a broken namespace, or a core built
  # without its generated sync flavour would otherwise surface only at release
  # time, when the first upload is already irreversible. This runs exactly the
  # script release.yml runs, minus the release version it has no source for.
  release-dry-run:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: 'recursive'
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync
      - name: Generate the sync flavour
        run: uv run unasync
      - name: Build both distributions
        run: |
          set -euo pipefail
          uv build --package ably-pubsub-core --out-dir dist
          uv build --package ably-pubsub-server --out-dir dist
      - name: 'Release pre-flight (same script as release.yml)'
        run: uv run python scripts/release_preflight.py dist/
